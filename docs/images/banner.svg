  <text x="280" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="700" fill="#ffffff">InvenCore</text>
  <text x="280" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#94a3b8">Enterprise Inventory Management System</text>
  <rect x="280" y="200" width="200" height="4" rx="2" fill="url(#accent)"/>
