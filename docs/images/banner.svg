  </defs>
  <rect width="1280" height="280" fill="url(#bg)" rx="16"/>
  <rect x="60" y="60" width="160" height="160" rx="32" fill="none" stroke="url(#logoGrad)" stroke-width="4"/>
  <rect x="70" y="70" width="60" height="60" rx="12" fill="url(#logoGrad)" opacity="0.9"/>
